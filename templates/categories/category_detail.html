{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">{{ category.name }}</h1>
<ul class="space-y-2 mb-4">
    {% for member in category.members.all %}
        <li class="flex justify-between items-center border border-gray-200 rounded p-2">
            <span>{{ member.user }}</span>
            <form method="post" action="{% url 'categories:remove_member' category.pk member.user.pk %}">
                {% csrf_token %}
                <button type="submit" class="text-sm text-red-600">Remove</button>
            </form>
        </li>
    {% empty %}
        <li class="text-gray-500">No members yet.</li>
    {% endfor %}
</ul>
<form method="post" action="{% url 'categories:add_member' category.pk %}" class="flex gap-2 items-end">
    {% csrf_token %}
    {{ add_member_form.as_p }}
    <button type="submit" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm">Add member</button>
</form>
{% endblock %}
