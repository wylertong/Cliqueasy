{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Log in</h1>
<form method="post" class="space-y-3 max-w-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Log in</button>
</form>
{% endblock %}
