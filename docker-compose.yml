services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cliquey
      POSTGRES_USER: cliquey
      POSTGRES_PASSWORD: cliquey
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

volumes:
  pgdata:
